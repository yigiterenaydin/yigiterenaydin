<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>İlk Sayfam</title>
    <style>
      :root {
        color-scheme: light dark;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
        background: linear-gradient(135deg, #0ea5e9, #1d4ed8);
        color: #fff;
      }

      .card {
        width: min(90vw, 680px);
        padding: 2rem;
        border-radius: 16px;
        background: rgba(0, 0, 0, 0.25);
        backdrop-filter: blur(6px);
        box-shadow: 0 20px 45px rgba(0, 0, 0, 0.25);
      }

      h1 {
        margin: 0 0 0.75rem;
        font-size: clamp(1.8rem, 4vw, 2.6rem);
      }

      p {
        margin: 0;
        line-height: 1.6;
        opacity: 0.95;
      }

      .tag {
        display: inline-block;
        margin-top: 1rem;
        padding: 0.35rem 0.7rem;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.18);
        font-size: 0.85rem;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <h1>Merhaba 👋</h1>
      <p>
        Bu, repodaki ilk örnek sayfan. İstersen bir sonraki adımda bunu kişisel
        portfolyo, proje tanıtım veya landing page haline getirebiliriz.
      </p>
      <span class="tag">Hazır: index.html</span>
    </main>
  </body>
</html>
